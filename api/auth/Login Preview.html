<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ellipse — login preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #07060c; color: #f3f1fb;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 24px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 400px;
    background: linear-gradient(180deg, #141126 0%, #100e1a 60%);
    border: 1px solid #221e33; border-radius: 18px; padding: 32px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.02);
    animation: fade .35s ease both;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
  .logo { width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(135deg,#7c3aed,#a855f7);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px -6px rgba(139,92,246,.55); }
  h1 { font-size: 22px; font-weight: 700; margin: 18px 0 2px; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: #6b6588; margin: 0 0 24px; }
  label.f { display: block; font-size: 12.5px; color: #9d97b8; margin-bottom: 7px; font-weight: 500; }
  .wrap { position: relative; }
  input.pw { width: 100%; padding: 12px 42px 12px 13px; border-radius: 10px;
    border: 1px solid #2a2440; background: #15121f; color: #f3f1fb; font-size: 14px; outline: none;
    transition: border-color .15s, box-shadow .15s; }
  input.pw:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.18); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #6b6588; padding: 6px; display: flex; }
  .eye:hover { color: #f3f1fb; }
  .remember { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #9d97b8; cursor: pointer; }
  .remember input { accent-color: #8b5cf6; width: 15px; height: 15px; }
  button.signin { width: 100%; margin-top: 20px; padding: 12px 16px; border-radius: 10px; border: none;
    background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: filter .15s; }
  button.signin:hover { filter: brightness(1.08); }
  .foot { margin-top: 20px; font-size: 11.5px; line-height: 1.6; color: #6b6588; text-align: center; }
</style>
</head>
<body>
  <div class="glow" style="width:420px;height:420px;top:-120px;left:-100px;background:rgba(124,58,237,.22)"></div>
  <div class="glow" style="width:380px;height:380px;bottom:-140px;right:-110px;background:rgba(168,85,247,.16)"></div>
  <form class="card" onsubmit="return false">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="12" rx="10" ry="5.5" stroke="#fff" stroke-width="1.8" opacity=".95"/>
        <ellipse cx="12" cy="12" rx="5.5" ry="10" stroke="#fff" stroke-width="1.8" opacity=".55"/>
        <circle cx="12" cy="12" r="1.8" fill="#fff"/>
      </svg>
    </div>
    <h1>Ellipse</h1>
    <p class="sub">Trading Dashboard</p>
    <label class="f" for="pw">Password</label>
    <div class="wrap">
      <input class="pw" id="pw" type="password" value="hunter2secret" />
      <button class="eye" type="button" aria-label="Show password" onclick="var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password';">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <label class="remember"><input type="checkbox" checked /> Remember me for 30 days</label>
    <button class="signin" type="submit">Sign in</button>
    <p class="foot">Protected access. API routes and Supabase RLS are enforced server-side.</p>
  </form>
</body>
</html>
